<style>
  :root {
    --bg: #060608;
    --paper: #f5f3f8;
    --pink: #ff2fa8;
    --pink-dim: #ff2fa855;
    --blue: #2fd9ff;
    --blue-dim: #2fd9ff55;
    --line: rgba(245,243,248,0.12);
    --muted: rgba(245,243,248,0.55);
    --card-bg: transparent;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--paper); font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; justify-content: center; }
  #app {
    width: 100%; max-width: 460px; min-height: 100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,47,168,0.16) 0%, transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(47,217,255,0.14) 0%, transparent 40%),
      var(--bg);
    display: flex; flex-direction: column; position: relative; transition: background 0.3s ease, color 0.3s ease;
  }
  .screen { padding: max(28px, env(safe-area-inset-top)) 22px calc(100px + env(safe-area-inset-bottom)); flex: 1; position: relative; animation: screenIn 0.45s ease; overflow: hidden; }
  @keyframes screenIn {
    0% { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .screen::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--blue), var(--pink), transparent);
    animation: sweep 0.6s ease-out forwards; box-shadow: 0 0 12px rgba(47,217,255,0.6);
  }
  @keyframes sweep { 0% { left: -100%; } 100% { left: 100%; } }

  .brand {
    font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.22em;
    background: linear-gradient(90deg, var(--pink), var(--blue));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 6px;
  }
  h1 { font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 25px; line-height: 1.3; margin-bottom: 10px; letter-spacing: 0.01em; }
  .sub { color: var(--muted); font-size: 16px; line-height: 1.5; margin-bottom: 30px; font-weight: 500; }

  .role-grid { display: flex; flex-direction: column; gap: 14px; }
  .role-card {
    border: 1px solid var(--blue-dim); border-radius: 6px; padding: 22px 20px;
    background: rgba(47,217,255,0.04); cursor: pointer;
    box-shadow: 0 0 0 rgba(47,217,255,0); transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .role-card:active { box-shadow: 0 0 22px rgba(47,217,255,0.25); border-color: var(--blue); }
  .role-card h3 { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.02em; }
  .role-card p { color: var(--muted); font-size: 15px; font-weight: 500; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .topbar .brand { margin-bottom: 0; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .role-pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; border-radius: 20px; font-weight: 600; letter-spacing: 0.02em; }
  .icon-btn { background: none; border: 1px solid var(--line); color: var(--muted); font-size: 13px; padding: 5px 11px; border-radius: 20px; cursor: pointer; font-weight: 600; }

  .search-input { margin-bottom: 14px; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .sort-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .sort-chip { font-size: 13px; border: 1px solid var(--line); color: var(--muted); padding: 7px 14px; border-radius: 20px; cursor: pointer; font-weight: 600; }
  .sort-chip.active { border-color: var(--pink); color: var(--pink); background: rgba(255,47,168,0.08); }

  .event-card { border-top: 1px solid var(--line); padding: 18px 0; cursor: pointer; position: relative; background: var(--card-bg); }
  .event-card:last-child { border-bottom: 1px solid var(--line); }
  .event-date { font-family: 'Orbitron', sans-serif; font-size: 11px; color: var(--blue); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; text-shadow: 0 0 12px rgba(47,217,255,0.5); }
  .event-title { font-size: 19px; font-weight: 600; margin-bottom: 4px; padding-right: 40px; }
  .event-meta { font-size: 14px; color: var(--muted); font-weight: 500; }
  .event-going { font-size: 13px; color: var(--pink); margin-top: 8px; text-shadow: 0 0 10px rgba(255,47,168,0.5); font-weight: 600; }
  .event-price { font-size: 12px; color: var(--muted); font-weight: 600; }
  .dept-badge { font-size: 11px; color: var(--blue); font-weight: 600; border: 1px solid var(--blue-dim); padding: 2px 8px; border-radius: 12px; display: inline-block; margin-bottom: 6px; }
  .cancelled-badge { font-size: 11px; color: var(--pink); font-weight: 700; border: 1px solid var(--pink-dim); padding: 2px 8px; border-radius: 12px; display: inline-block; margin-bottom: 6px; text-transform: uppercase; }

  .fav-btn { position: absolute; top: 18px; right: 0; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--line); line-height: 1; }
  .fav-btn.active { color: var(--pink); text-shadow: 0 0 10px rgba(255,47,168,0.6); }

  .fab {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(calc(-50% + 165px));
    background: var(--pink); color: #0a0510; border: none; width: 56px; height: 56px; border-radius: 50%;
    font-size: 28px; box-shadow: 0 0 24px rgba(255,47,168,0.55), 0 6px 20px rgba(0,0,0,0.4);
  }

  .back-btn { background: none; border: none; color: var(--muted); font-size: 15px; margin-bottom: 20px; cursor: pointer; padding: 0; font-weight: 600; }
  .link-btn { background: none; border: none; color: var(--blue); font-size: 14px; cursor: pointer; padding: 0; font-weight: 600; text-shadow: 0 0 10px rgba(47,217,255,0.4); }

  .detail-title { font-family: 'Orbitron', sans-serif; font-size: 21px; font-weight: 600; margin-bottom: 8px; }
  .detail-row { display: flex; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .detail-row:last-of-type { border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .detail-label { color: var(--muted); width: 100px; flex-shrink: 0; font-weight: 600; }
  .detail-desc { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 20px 0; font-weight: 500; }

  .attendee-list { margin: 20px 0; }
  .attendee-list h4 { font-family: 'Orbitron', sans-serif; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; font-weight: 600; }
  .attendee-chip { display: inline-block; font-size: 13px; background: rgba(255,47,168,0.1); border: 1px solid var(--pink-dim); color: var(--paper); padding: 5px 12px; border-radius: 20px; margin: 0 6px 6px 0; font-weight: 600; cursor: pointer; }

  .style-chip { display: inline-block; font-size: 13px; border: 1px solid var(--line); color: var(--muted); padding: 7px 14px; border-radius: 20px; margin: 0 8px 8px 0; cursor: pointer; font-weight: 600; transition: all 0.15s ease; }
  .style-chip.active { border-color: var(--blue); color: var(--blue); background: rgba(47,217,255,0.08); box-shadow: 0 0 10px rgba(47,217,255,0.25); }
  .style-wrap { display: flex; flex-wrap: wrap; margin-bottom: 20px; }

  button.primary {
    width: 100%; background: var(--pink); color: #0a0510; border: none; padding: 16px; border-radius: 6px;
    font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 0 20px rgba(255,47,168,0.4);
    font-family: 'Rajdhani', sans-serif; letter-spacing: 0.03em; transition: transform 0.1s ease;
  }
  button.primary:active { transform: scale(0.98); }
  button.primary.going { background: transparent; border: 1px solid var(--blue); color: var(--blue); box-shadow: 0 0 14px rgba(47,217,255,0.3); }
  button.primary:disabled { opacity: 0.5; box-shadow: none; }
  button.secondary {
    width: 100%; background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 14px;
    border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px;
  }
  button.danger-outline { color: var(--pink); border-color: var(--pink-dim); }

function formatEventDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
}
function todayISO() {
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
}
function isEventHidden(ev) {
  if (!ev.dateISO) return false;
  const hideAt = new Date(ev.dateISO + 'T00:00:00');
  hideAt.setDate(hideAt.getDate() + 1);
  hideAt.setHours(5, 0, 0, 0);
  return new Date() >= hideAt;
}

let state = {
  ready: false,
  user: null,
  profile: null,
  events: [],
  screen: 'loading',
  currentEventId: null,
  viewedProfileUid: null,
  viewedProfile: null,

};

window.addEventListener('online', () => { state.online = true; render(); });
window.addEventListener('offline', () => { state.online = false; render(); });

let unsubEvents = null;

function watchEvents() {
  if (unsubEvents) return;
  const q = query(collection(db, 'events'), orderBy('createdAt', 'desc'));
  unsubEvents = onSnapshot(q, (snap) => {
    state.events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

const urlParams = new URLSearchParams(window.location.search);
const deepLinkEventId = urlParams.get('event');

onAuthStateChanged(auth, async (user) => {
  state.user = user;
  if (user) {
    const snap = await getDoc(doc(db, 'users', user.uid));
    state.profile = snap.exists() ? snap.data() : null;
    watchEvents();
    if (!state.profile) {
      state.screen = 'complete-profile';
    } else if (deepLinkEventId) {
      state.currentEventId = deepLinkEventId;
      state.screen = 'detail';
    } else {
      state.screen = 'feed';
    }
  } else {
    state.screen = 'welcome';
    state.profile = null;
  }
  state.ready = true;
  render();
});

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (!state.ready) { app.appendChild(el('div', {class: 'loading', text: 'PULSE'})); return; }

  if (!state.online) app.appendChild(el('div', {class: 'offline-banner', text: '📡 Pas de connexion internet'}));
  app.appendChild(el('div', {class: 'save-indicator', id: 'save-indicator', text: 'Sync'}));

  if (state.showOnboarding) { app.appendChild(OnboardingScreen()); return; }

  else if (state.screen === 'signup') app.appendChild(SignupScreen());
  else if (state.screen === 'login') app.appendChild(LoginScreen());
  else if (state.screen === 'reset-password') app.appendChild(ResetPasswordScreen());
  else if (state.screen === 'complete-profile') app.appendChild(CompleteProfileScreen());
  else if (state.screen === 'feed') app.appendChild(FeedScreen());
  else if (state.screen === 'detail') app.appendChild(DetailScreen());
  else if (state.screen === 'create') app.appendChild(CreateScreen());
  else if (state.screen === 'edit') app.appendChild(EditScreen());
  else if (state.screen === 'duplicate') app.appendChild(DuplicateScreen());
  else if (state.screen === 'profile') app.appendChild(ProfileScreen());
  else if (state.screen === 'legal') app.appendChild(LegalScreen());
  else if (state.screen === 'my-events') app.appendChild(MyEventsScreen());
  else if (state.screen === 'history') app.appendChild(HistoryScreen());
  else if (state.screen === 'other-profile') app.appendChild(OtherProfileScreen());
}

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'text') e.textContent = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => c && e.appendChild(c));
  return e;
}

let flashTimeout;
function flashSaved() {
  const ind = document.getElementById('save-indicator');
  if (!ind) return;
  ind.classList.add('show');
  clearTimeout(flashTimeout);

function LoginScreen() {
  const screen = el('div', {class: 'screen'});
  screen.appendChild(el('button', {class: 'back-btn', text: '← Retour', onclick: () => { state.screen = 'welcome'; render(); }}));

  if (state.authError) screen.appendChild(el('div', {class: 'error-msg', text: state.authError}));
  const emailInput = el('input', {placeholder: 'Email', type: 'email'});
  const passInput = el('input', {placeholder: 'Mot de passe', type: 'password'});
  screen.appendChild(el('div', {class: 'field'}, [emailInput]));
  screen.appendChild(el('div', {class: 'field'}, [passInput]));
  const btn = el('button', {
    class: 'primary', text: 'Se connecter',
    onclick: async () => {
      state.authError = '';
      btn.disabled = true; btn.textContent = 'Connexion…';
      try {
        await signInWithEmailAndPassword(auth, emailInput.value.trim(), passInput.value);
      } catch (e) {
        state.authError = friendlyAuthError(e);
        btn.disabled = false; btn.textContent = 'Se connecter';
        render();
      }
    }
  });
  screen.appendChild(btn);
  screen.appendChild(el('button', {class: 'link-btn', text: 'Mot de passe oublié ?', style: 'margin-top:16px;', onclick: () => { state.screen = 'reset-password'; state.authError=''; render(); }}));

}

function SignupScreen() {
  const screen = el('div', {class: 'screen'});
  screen.appendChild(el('button', {class: 'back-btn', text: '← Retour', onclick: () => { state.screen = 'welcome'; render(); }}));

  const nameInput = el('input', {placeholder: 'Ton prénom', maxlength: '30'});

  const emailInput = el('input', {placeholder: 'Email', type: 'email'});
  const passInput = el('input', {placeholder: 'Mot de passe (6 caractères min.)', type: 'password'});
  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Email'}), emailInput]));
  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Mot de passe'}), passInput]));

  const roleGrid = el('div', {class: 'role-grid', style: 'margin-bottom:20px'});
  const dancerCard = el('div', { class: 'role-card', onclick: () => { state.pendingRole = 'dancer'; render(); } }, [el('h3', {text: 'Danseur·se'})]);
  const orgCard = el('div', { class: 'role-card', onclick: () => { state.pendingRole = 'organizer'; render(); } }, [el('h3', {text: 'Organisateur·rice'})]);
  if (state.pendingRole === 'dancer') dancerCard.style.borderColor = 'var(--blue)';

  screen.appendChild(el('label', {text: 'Danses pratiquées'}));
  const styleWrap = el('div', {class: 'style-wrap'});
  DANCE_STYLES.forEach(style => {
    const active = state.pendingStyles.includes(style);
    const chip = el('span', {
      class: 'style-chip' + (active ? ' active' : ''), text: style,
      onclick: () => {
        if (state.pendingStyles.includes(style)) state.pendingStyles = state.pendingStyles.filter(s => s !== style);
        else state.pendingStyles.push(style);
        render();
      }
    });
    styleWrap.appendChild(chip);
  });
  screen.appendChild(styleWrap);

  const legalCheckbox = el('input', {type: 'checkbox', id: 'legal-accept'});
  const legalRow = el('div', {class: 'checkbox-row'});

  const legalLabel = el('label', {});

  legalLabel.appendChild(el('span', {text: 'mentions légales et la politique de confidentialité', style: 'color:var(--blue); text-decoration:underline; cursor:pointer;', onclick: (e) => { e.preventDefault(); state.screen = 'legal'; render(); }}));
  legalRow.appendChild(legalLabel);
  screen.appendChild(legalRow);

  const btn = el('button', {
    class: 'primary', text: 'Créer mon compte',
    onclick: async () => {
      state.authError = '';
      const name = nameInput.value.trim();
      if (!name) { state.authError = 'Renseigne ton prénom.'; render(); return; }
      if (!emailInput.value.trim() || passInput.value.length < 6) { state.authError = 'Email valide et mot de passe de 6 caractères minimum.'; render(); return; }
      if (!state.pendingRole) { state.authError = 'Choisis si tu es danseur·se ou organisateur·rice.'; render(); return; }
      if (!legalCheckbox.checked) { state.authError = "Merci d'accepter les mentions légales pour continuer."; render(); return; }
      btn.disabled = true; btn.textContent = 'Création…';
      try {
        const cred = await createUserWithEmailAndPassword(auth, emailInput.value.trim(), passInput.value);
        try { await sendEmailVerification(cred.user); } catch(e) {}
        const profile = { name, role: state.pendingRole, danceStyles: state.pendingStyles, acceptedLegalAt: Date.now(), favorites: [] };
        await setDoc(doc(db, 'users', cred.user.uid), profile);
        state.profile = profile;
        state.showOnboarding = true;
        state.onboardingStep = 0;
      } catch (e) {
        state.authError = friendlyAuthError(e);
        btn.disabled = false; btn.textContent = 'Créer mon compte';
        render();
      }
    }
  });
  screen.appendChild(btn);
  return screen;
}

    { title: "C'est parti", text: "Crée ta première soirée dès maintenant depuis le bouton +." }
  ] : [
    { title: 'Bienvenue sur Pulse', text: 'Découvre les soirées de danse près de chez toi, filtrées par département.' },
    { title: 'RSVP en un clic', text: 'Dis "j\'y vais" et vois qui d\'autre sera présent.' },
    { title: 'Filtre à ta façon', text: 'Trie par date, popularité, prix, ou ne garde que tes styles favoris.' }
  ];
  const screen = el('div', {class: 'screen'});
  screen.appendChild(el('div', {class: 'brand', text: 'PULSE'}));
  const s = slides[state.onboardingStep];
  screen.appendChild(el('h1', {text: s.title}));
  screen.appendChild(el('p', {class: 'sub', text: s.text}));
  const dots = el('div', {class: 'onboard-dots'});
  slides.forEach((_, i) => dots.appendChild(el('span', {class: 'onboard-dot' + (i === state.onboardingStep ? ' active' : '')})));
  screen.appendChild(dots);
  const isLast = state.onboardingStep === slides.length - 1;
  screen.appendChild(el('button', {
    class: 'primary', text: isLast ? 'Découvrir Pulse' : 'Suivant',
    onclick: () => {
      if (isLast) { state.showOnboarding = false; state.screen = 'feed'; }
      else state.onboardingStep++;
      render();
    }
  }));
  return screen;
}

function renderFeedListOnly() {
  const list = document.getElementById('feed-list');
  if (!list) return;
  list.innerHTML = '';
  list.appendChild(buildFeedList());
}

function buildFeedList() {
  const frag = document.createDocumentFragment();
  let events = state.events.filter(ev => !isEventHidden(ev) && ev.status !== 'cancelled');
  if (state.deptFilter) events = events.filter(ev => ev.dept === state.deptFilter);
  if (state.danceFilter) events = events.filter(ev => (ev.danceStyles||[]).includes(state.danceFilter));
  if (state.searchQuery.trim()) {
    const q = state.searchQuery.trim().toLowerCase();
    events = events.filter(ev => (ev.title||'').toLowerCase().includes(q) || (ev.place||'').toLowerCase().includes(q));
  }
  if (state.showFavoritesOnly) {
    const favs = state.profile.favorites || [];
    events = events.filter(ev => favs.includes(ev.id));
  }
  if (state.sortBy === 'popular') events.sort((a, b) => (b.attendees||[]).length - (a.attendees||[]).length);
  else if (state.sortBy === 'price') events.sort((a, b) => (a.price||0) - (b.price||0));
  else events.sort((a, b) => ((a.dateISO||'') + (a.time||'')).localeCompare((b.dateISO||'') + (b.time||'')));

  if (events.length === 0) {
    frag.appendChild(el('div', {class: 'empty', text: 'Aucune soirée pour le moment.'}));
    return frag;
  }
  events.forEach(ev => {
    const attendees = ev.attendees || [];
    const going = attendees.some(a => a.uid === state.user.uid);
    const isFav = (state.profile.favorites || []).includes(ev.id);
    const card = el('div', { class: 'event-card', onclick: () => { state.currentEventId = ev.id; state.screen = 'detail'; render(); } }, [
      el('button', {
        class: 'fav-btn' + (isFav ? ' active' : ''), text: isFav ? '♥' : '♡',
        onclick: async (e) => {
          e.stopPropagation();
          const favs = state.profile.favorites || [];
          const newFavs = isFav ? favs.filter(id => id !== ev.id) : [...favs, ev.id];
          state.profile.favorites = newFavs;
          render();
          try { await updateDoc(doc(db, 'users', state.user.uid), { favorites: newFavs }); } catch(err) {}
        }
      }),
      el('div', {class: 'event-date', text: formatEventDate(ev.dateISO) + ' · ' + ev.time}),
      el('div', {class: 'event-title', text: ev.title}),
      el('div', {class: 'event-meta', text: ev.place}),
      el('div', {class: 'event-price', text: (ev.price ? ev.price + ' €' : 'Gratuit') + ' · ' + attendees.length + ' inscrit·e·s'})
    ]);
    if ((ev.danceStyles||[]).length) {
      const dwrap = el('div', {style: 'margin-top:6px;'});
      ev.danceStyles.forEach(s => dwrap.appendChild(el('span', {class: 'attendee-chip', text: s, style: 'background:rgba(47,217,255,0.08); border-color:var(--blue-dim); color:var(--blue); cursor:default;'})));
      card.appendChild(dwrap);
    }
    if (ev.dept) card.insertBefore(el('div', {class: 'dept-badge', text: ev.dept}), card.firstChild);
    if (going) card.appendChild(el('div', {class: 'event-going', text: '✓ Tu y vas'}));
    frag.appendChild(card);
  });
  return frag;
}

    state.countedViews.add(ev.id);

  }

  screen.appendChild(el('div', {class: 'detail-row'}, [el('div', {class: 'detail-label', text: 'Prix'}), el('div', {text: ev.price ? ev.price + ' €' : 'Gratuit'})]));
  screen.appendChild(el('div', {class: 'detail-row'}, [el('div', {class: 'detail-label', text: 'Participants'}), el('div', {text: attendees.length + ' inscrit·e·s'})]));
  screen.appendChild(el('div', {class: 'detail-desc', text: ev.desc}));

  const actionRow = el('div', {style: 'display:flex; gap:10px; margin-bottom:16px;'});

    class: 'secondary', text: isFav ? '♥ Favori' : '♡ Ajouter aux favoris', style: 'margin-top:0;',

      const newFavs = isFav ? favs.filter(id => id !== ev.id) : [...favs, ev.id];

      render();
      try { await updateDoc(doc(db, 'users', state.user.uid), { favorites: newFavs }); } catch(err) {}

  actionRow.appendChild(el('button', {

      if (navigator.share) {
        try { await navigator.share({ title: ev.title, text: 'Découvre cette soirée sur Pulse', url }); } catch(e) {}
      } else {
        try { await navigator.clipboard.writeText(url); flashSaved(); } catch(e) {}
      }
    }
  }));
  screen.appendChild(actionRow);

  screen.appendChild(el('button', {
    class: 'secondary', text: '📅 Ajouter à mon calendrier', style: 'margin-top:0; margin-bottom:16px;',

  }));

    attList.appendChild(el('div', {class: 'empty', text: "Personne pour l'instant."}));
  } else {
    attendees.forEach(a => attList.appendChild(el('span', {
      class: 'attendee-chip', text: a.name,
      onclick: async () => {
        try {

          state.viewedProfile = snap.exists() ? snap.data() : null;
          state.viewedProfileUid = a.uid;
        } catch(e) { state.viewedProfile = null; }
        state.screen = 'other-profile';
        render();

  }

    screen.appendChild(manageRow);

      class: 'secondary', text: 'Exporter les participants (CSV)', style: 'margin-top:0; margin-bottom:10px;',
      onclick: () => downloadCSV(ev)

      screen.appendChild(el('button', {

        if (going) newAttendees = attendees.filter(a => a.uid !== state.user.uid);
        else newAttendees = [...attendees, { uid: state.user.uid, name: state.profile.name }];
        ev.attendees = newAttendees;
        render();
        try { await updateDoc(doc(db, 'events', ev.id), { attendees: newAttendees }); flashSaved(); } catch (err) { console.error('Échec RSVP', err); }
      }
    }));

  return screen;
}

function downloadCSV(ev) {
  const rows = [['Prénom'], ...(ev.attendees||[]).map(a => [a.name])];
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'participants-' + (ev.title||'soiree').replace(/[^a-z0-9]/gi,'-') + '.csv';
  a.click();
}

function downloadICS(ev) {
  const start = (ev.dateISO||'').replace(/-/g,'') + 'T' + (ev.time||'20:00').replace(':','') + '00';
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT',
    'SUMMARY:' + (ev.title||'Soirée Pulse'),
    'LOCATION:' + (ev.place||''),
    'DESCRIPTION:' + (ev.desc||'').replace(/\n/g,' '),
    'DTSTART:' + start,
    'END:VEVENT','END:VCALENDAR'].join('\n');
  const blob = new Blob([ics], {type: 'text/calendar;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (ev.title||'soiree').replace(/[^a-z0-9]/gi,'-') + '.ics';
  a.click();
}

// ---------- MY EVENTS / HISTORY ----------

function MyEventsScreen() {
  const screen = el('div', {class: 'screen'});
  screen.appendChild(el('button', {class: 'back-btn', text: '← Retour', onclick: () => { state.screen = 'profile'; render(); }}));
  screen.appendChild(el('h1', {text: 'Mes soirées'}));
  const mine = state.events.filter(ev => ev.organizerUid === state.user.uid).sort((a,b) => ((b.dateISO||'')+(b.time||'')).localeCompare((a.dateISO||'')+(a.time||'')));
  if (mine.length === 0) {
    screen.appendChild(el('div', {class: 'empty', text: "Tu n'as pas encore créé de soirée."}));
  } else {
    mine.forEach(ev => {
      const hidden = isEventHidden(ev);
      const card = el('div', { class: 'event-card', onclick: () => { state.currentEventId = ev.id; state.screen = 'detail'; render(); } }, [
        el('div', {class: 'event-date', text: formatEventDate(ev.dateISO) + ' · ' + ev.time}),
        el('div', {class: 'event-title', text: ev.title}),
        el('div', {class: 'event-price', text: (ev.attendees||[]).length + ' inscrit·e·s · ' + (ev.views||0) + ' vues'})
      ]);
      if (ev.status === 'cancelled') card.insertBefore(el('div', {class: 'cancelled-badge', text: 'Annulée'}), card.firstChild);
      else if (hidden) card.insertBefore(el('div', {class: 'dept-badge', text: 'Passée'}), card.firstChild);
      screen.appendChild(card);
    });
  }
  return screen;
}

function HistoryScreen() {
  const screen = el('div', {class: 'screen'});
  screen.appendChild(el('button', {class: 'back-btn', text: '← Retour', onclick: () => { state.screen = 'profile'; render(); }}));
  screen.appendChild(el('h1', {text: 'Historique'}));
  const past = state.events.filter(ev => isEventHidden(ev) && (ev.attendees||[]).some(a => a.uid === state.user.uid))
    .sort((a,b) => ((b.dateISO||'')+(b.time||'')).localeCompare((a.dateISO||'')+(a.time||'')));
  if (past.length === 0) {
    screen.appendChild(el('div', {class: 'empty', text: "Aucune soirée passée pour l'instant."}));
  } else {
    past.forEach(ev => {
      screen.appendChild(el('div', {class: 'event-card'}, [
        el('div', {class: 'event-date', text: formatEventDate(ev.dateISO) + ' · ' + ev.time}),
        el('div', {class: 'event-title', text: ev.title}),
        el('div', {class: 'event-meta', text: ev.place})
      ]));
    });
  }
  return screen;
}

// ---------- CREATE / EDIT / DUPLICATE ----------

function EventFormScreen(existingEvent, mode) {
  const isEdit = mode === 'edit';
  const isDuplicate = mode === 'duplicate';
  const screen = el('div', {class: 'screen'});
  screen.appendChild(el('button', {class: 'back-btn', text: '← Retour', onclick: () => { state.screen = existingEvent ? 'detail' : 'feed'; render(); }}));
  screen.appendChild(el('h1', {text: isEdit ? 'Modifier la soirée' : 'Nouvelle soirée'}));
  if (!isEdit) screen.appendChild(el('p', {class: 'sub', text: 'Renseigne les infos, les danseurs verront ta soirée dans le flux.'}));

  const titleInput = el('input', {placeholder: 'Titre de la soirée', maxlength: '60'});
  const dateInput = el('input', {type: 'date'});
  const timeInput = el('input', {type: 'time'});
  const placeInput = el('input', {placeholder: 'Lieu (ex. La Salsatheque, Marseille)', maxlength: '80'});
  const deptSelect = el('select', {});
  deptSelect.appendChild(el('option', {text: 'Choisir un département', value: ''}));
  DEPARTMENTS.forEach(d => deptSelect.appendChild(el('option', {text: d, value: d})));
  const priceInput = el('input', {placeholder: 'Prix en € (laisser vide si gratuit)', type: 'number', min: '0'});
  const descInput = el('textarea', {placeholder: 'Description', maxlength: '500'});

  let localDanceStyles = existingEvent && existingEvent.danceStyles ? [...existingEvent.danceStyles] : [];

  if (existingEvent) {
    titleInput.value = existingEvent.title || '';
    dateInput.value = isDuplicate ? '' : (existingEvent.dateISO || '');
    timeInput.value = existingEvent.time || '';
    placeInput.value = existingEvent.place || '';
    deptSelect.value = existingEvent.dept || '';
    priceInput.value = existingEvent.price || '';
    descInput.value = existingEvent.desc || '';
  }

  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Titre'}), titleInput]));
  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Date'}), dateInput]));
  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Heure'}), timeInput]));
  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Lieu'}), placeInput]));
  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Département'}), deptSelect]));
  screen.appendChild(el('label', {text: 'Danse(s) au programme'}));
  const danceWrap = el('div', {class: 'style-wrap'});
  DANCE_STYLES.forEach(style => {
    const active = localDanceStyles.includes(style);
    const chip = el('span', {
      class: 'style-chip' + (active ? ' active' : ''), text: style,
      onclick: () => {
        if (localDanceStyles.includes(style)) localDanceStyles = localDanceStyles.filter(s => s !== style);
        else localDanceStyles.push(style);
        chip.className = 'style-chip' + (localDanceStyles.includes(style) ? ' active' : '');
      }
    });
    danceWrap.appendChild(chip);
  });
  screen.appendChild(danceWrap);
  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Prix'}), priceInput]));
  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Description'}), descInput]));

  const submitBtn = el('button', {
    class: 'primary', text: isEdit ? 'Enregistrer les modifications' : 'Publier la soirée',
    onclick: async () => {
      if (!titleInput.value || !dateInput.value || !placeInput.value || !deptSelect.value) return;
      submitBtn.disabled = true;
      submitBtn.textContent = isEdit ? 'Enregistrement…' : 'Publication…';
      const payload = {
        title: titleInput.value, dateISO: dateInput.value, time: timeInput.value || '',
        place: placeInput.value, dept: deptSelect.value, danceStyles: localDanceStyles,
        price: priceInput.value ? Number(priceInput.value) : 0,
        desc: descInput.value || ''
      };
      try {
        if (isEdit) {
          await updateDoc(doc(db, 'events', existingEvent.id), payload);
          state.screen = 'detail';
        } else {
          await addDoc(collection(db, 'events'), { ...payload, attendees: [], views: 0, status: 'active', organizerUid: state.user.uid, createdAt: Date.now() });
          state.screen = 'feed';
        }
        render();
      } catch (err) {
        console.error('Échec enregistrement soirée', err);
        submitBtn.disabled = false;
        submitBtn.textContent = isEdit ? 'Enregistrer les modifications' : 'Publier la soirée';
      }
    }
  });
  screen.appendChild(submitBtn);
  return screen;
}

function CreateScreen() { return EventFormScreen(null, 'create'); }
function EditScreen() {
  const ev = state.events.find(e => e.id === state.currentEventId);
  if (!ev) { state.screen = 'feed'; render(); return el('div'); }
  return EventFormScreen(ev, 'edit');
}
function DuplicateScreen() {
  const ev = state.events.find(e => e.id === state.currentEventId);
  if (!ev) { state.screen = 'feed'; render(); return el('div'); }
  return EventFormScreen(ev, 'duplicate');
}

render();
</script>
