  'auth/network-request-failed': 'Problème de connexion internet.',
  'auth/weak-password': 'Mot de passe trop faible (6 caractères minimum).'
};
function friendlyAuthError(e) {
  return AUTH_ERROR_MESSAGES[e.code] || ('Erreur : ' + e.message);
}

function formatEventDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
}
function todayISO() {
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
}
function isEventHidden(ev) {
  if (!ev.dateISO) return false;
  const hideAt = new Date(ev.dateISO + 'T00:00:00');
  hideAt.setDate(hideAt.getDate() + 1);
  hideAt.setHours(5, 0, 0, 0);
  return new Date() >= hideAt;
}

let unsubEvents = null;

function watchEvents() {
  if (unsubEvents) return;
  const q = query(collection(db, 'events'), orderBy('createdAt', 'desc'));
  unsubEvents = onSnapshot(q, (snap) => {
    state.events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

const urlParams = new URLSearchParams(window.location.search);
const deepLinkEventId = urlParams.get('event');

onAuthStateChanged(auth, async (user) => {
  state.user = user;
  if (user) {
    const snap = await getDoc(doc(db, 'users', user.uid));
    state.profile = snap.exists() ? snap.data() : null;
    watchEvents();
    if (!state.profile) {
      state.screen = 'complete-profile';
    } else if (deepLinkEventId) {
      state.currentEventId = deepLinkEventId;
      state.screen = 'detail';
    } else {
      state.screen = 'feed';
    }
  } else {
    state.screen = 'welcome';
    state.profile = null;
  }
  state.ready = true;
  render();
});

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (!state.ready) { app.appendChild(el('div', {class: 'loading', text: 'PULSE'})); return; }

  if (!state.online) app.appendChild(el('div', {class: 'offline-banner', text: '📡 Pas de connexion internet'}));
  app.appendChild(el('div', {class: 'save-indicator', id: 'save-indicator', text: 'Sync'}));

  if (state.showOnboarding) { app.appendChild(OnboardingScreen()); return; }
  if (state.screen === 'welcome') app.appendChild(WelcomeScreen());
  else if (state.screen === 'signup') app.appendChild(SignupScreen());
  else if (state.screen === 'login') app.appendChild(LoginScreen());
  else if (state.screen === 'reset-password') app.appendChild(ResetPasswordScreen());
  else if (state.screen === 'complete-profile') app.appendChild(CompleteProfileScreen());
  else if (state.screen === 'feed') app.appendChild(FeedScreen());
  else if (state.screen === 'detail') app.appendChild(DetailScreen());
  else if (state.screen === 'create') app.appendChild(CreateScreen());
  else if (state.screen === 'edit') app.appendChild(EditScreen());
  else if (state.screen === 'duplicate') app.appendChild(DuplicateScreen());
  else if (state.screen === 'profile') app.appendChild(ProfileScreen());
  else if (state.screen === 'legal') app.appendChild(LegalScreen());
  else if (state.screen === 'my-events') app.appendChild(MyEventsScreen());
  else if (state.screen === 'history') app.appendChild(HistoryScreen());
  else if (state.screen === 'other-profile') app.appendChild(OtherProfileScreen());
}

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'text') e.textContent = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => c && e.appendChild(c));
  return e;
}

let flashTimeout;
function flashSaved() {
  const ind = document.getElementById('save-indicator');
  if (!ind) return;
  ind.classList.add('show');
  clearTimeout(flashTimeout);
  flashTimeout = setTimeout(() => ind.classList.remove('show'), 900);
}

  screen.appendChild(el('button', {class: 'back-btn', text: '← Retour', onclick: () => { state.screen = 'detail'; render(); }}));
  screen.appendChild(el('div', {class: 'brand', text: 'PULSE'}));
  if (!state.viewedProfile) {
    screen.appendChild(el('div', {class: 'empty', text: 'Profil introuvable.'}));
    return screen;
  }
  const p = state.viewedProfile;
  screen.appendChild(el('h1', {text: p.name}));
  screen.appendChild(el('div', {class: 'detail-row'}, [el('div', {class: 'detail-label', text: 'Rôle'}), el('div', {text: p.role === 'dancer' ? 'Danseur·se' : 'Organisateur·rice'})]));
  if (p.danceStyles && p.danceStyles.length) {
    screen.appendChild(el('label', {text: 'Danses pratiquées', style: 'margin-top:16px;'}));
    const wrap = el('div', {class: 'style-wrap'});
    p.danceStyles.forEach(s => wrap.appendChild(el('span', {class: 'style-chip active', text: s})));
    screen.appendChild(wrap);
  }
  if (p.instagram || p.facebook) {
    const socialRow = el('div', {style: 'display:flex; gap:10px; margin-top:16px; margin-bottom:20px; flex-wrap:wrap;'});
    if (p.instagram) {
      socialRow.appendChild(el('span', {
        class: 'style-chip', text: '📷 @' + p.instagram, style: 'border-color:var(--pink-dim); color:var(--pink);',
        onclick: () => window.open('https://instagram.com/' + p.instagram, '_blank')
      }));
    }
    if (p.facebook) {
      const fbUrl = p.facebook.startsWith('http') ? p.facebook : 'https://' + p.facebook;
      socialRow.appendChild(el('span', {
        class: 'style-chip', text: '👤 Facebook', style: 'border-color:var(--blue-dim); color:var(--blue);',
        onclick: () => window.open(fbUrl, '_blank')
      }));
    }
    screen.appendChild(socialRow);
  }
  if (p.role === 'organizer') {
    const others = state.events.filter(ev => ev.organizerUid === state.viewedProfileUid && ev.status !== 'cancelled' && !isEventHidden(ev) && ev.id !== state.currentEventId);
    screen.appendChild(el('h4', {text: 'Autres soirées de ' + p.name, style: 'margin-top:26px; margin-bottom:12px; font-family:Orbitron,sans-serif; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;'}));
    if (others.length === 0) {
      screen.appendChild(el('div', {class: 'empty', text: 'Aucune autre soirée pour le moment.'}));
    } else {
      others.forEach(ev => {
        screen.appendChild(el('div', { class: 'event-card', onclick: () => { state.currentEventId = ev.id; state.screen = 'detail'; render(); } }, [
          el('div', {class: 'event-date', text: formatEventDate(ev.dateISO) + ' · ' + ev.time}),
          el('div', {class: 'event-title', text: ev.title}),
          el('div', {class: 'event-meta', text: ev.place})
        ]));
      });
    }
  }
  return screen;
}

function FeedScreen() {
  const screen = el('div', {class: 'screen'});
  screen.appendChild(el('div', {class: 'topbar'}, [
    el('div', {class: 'brand', text: 'PULSE'}),
    el('div', {class: 'topbar-actions'}, [
      el('button', {class: 'icon-btn', text: 'Profil', onclick: async () => {
        try { await state.user.reload(); state.user = auth.currentUser; } catch(e) {}
        state.screen = 'profile'; render();
      }}),
      state.profile.isCreator ? el('span', {class: 'dept-badge', text: '★ Créateur·rice', style: 'margin-bottom:0'}) : null,
      el('div', {
        class: 'role-pill', text: (state.profile.role === 'dancer' ? 'Danseur·se' : 'Organisateur·rice') + '  ⇄',
        style: 'cursor:pointer', onclick: async () => { await signOut(auth); }
      })
    ])
  ]));

  // Notifications d'annulation pour les soirées auxquelles le danseur était inscrit
  const cancelledForMe = state.events.filter(ev => ev.status === 'cancelled' && (ev.attendees||[]).some(a => a.uid === state.user.uid) && !state.dismissedNotices.includes(ev.id));
  cancelledForMe.forEach(ev => {
    const banner = el('div', {class: 'notice-banner'}, [
      el('div', {class: 'title', text: 'Soirée annulée : ' + ev.title}),
      el('div', {text: ev.cancelReason || "L'organisateur a annulé cette soirée."}),
      el('span', {class: 'link-btn', text: 'OK, compris', style: 'display:inline-block; margin-top:8px;', onclick: async () => {
        state.dismissedNotices.push(ev.id);
        localStorage.setItem('pulse-dismissed-notices', JSON.stringify(state.dismissedNotices));
        const newAttendees = (ev.attendees||[]).filter(a => a.uid !== state.user.uid);
        ev.attendees = newAttendees;
        render();
        try { await updateDoc(doc(db, 'events', ev.id), { attendees: newAttendees }); } catch(e) {}
      }})
    ]);
    screen.appendChild(banner);
  });

  screen.appendChild(el('h1', {text: 'Soirées à venir'}));

  const toggleRow = el('div', {class: 'view-toggle'});
  toggleRow.appendChild(el('span', {
    class: 'view-toggle-btn' + (state.viewMode === 'list' ? ' active' : ''), text: '📋 Liste',
    onclick: () => { state.viewMode = 'list'; render(); }
  }));
  toggleRow.appendChild(el('span', {
    class: 'view-toggle-btn' + (state.viewMode === 'map' ? ' active' : ''), text: '🗺️ Carte',
    onclick: () => { state.viewMode = 'map'; render(); }
  }));
  screen.appendChild(toggleRow);

  if (state.viewMode === 'map') {
    return MapFullScreen();
  }

  const searchInput = el('input', {class: 'search-input', placeholder: 'Rechercher un titre, un lieu…', value: state.searchQuery});
  searchInput.oninput = (e) => { state.searchQuery = e.target.value; renderFeedListOnly(); };
  screen.appendChild(searchInput);

  const filterRow = el('div', {class: 'filter-row'});
  filterRow.appendChild(el('span', {
    class: 'sort-chip' + (state.showFavoritesOnly ? ' active' : ''), text: '❤ Favoris',
    onclick: () => { state.showFavoritesOnly = !state.showFavoritesOnly; render(); }
  }));
  DANCE_STYLES.forEach(style => {
    filterRow.appendChild(el('span', {
      class: 'sort-chip' + (state.danceFilter === style ? ' active' : ''), text: style,
      onclick: () => { state.danceFilter = state.danceFilter === style ? '' : style; render(); }
    }));
  });
  screen.appendChild(filterRow);

  const allDepts = [...new Set(state.events.map(ev => ev.dept).filter(Boolean))].sort();
  if (allDepts.length > 0) {
    const deptSelect = el('select', { onchange: (e) => { state.deptFilter = e.target.value; render(); } });
    deptSelect.appendChild(el('option', {text: 'Tous les départements', value: ''}));
    allDepts.forEach(d => {
      const opt = el('option', {text: d, value: d});
      if (state.deptFilter === d) opt.setAttribute('selected', 'selected');
      deptSelect.appendChild(opt);
    });
    screen.appendChild(deptSelect);
  }

  const sortRow = el('div', {class: 'sort-row'});
  [['date','Date'],['popular','Popularité'],['price','Prix']].forEach(([key,label]) => {
    sortRow.appendChild(el('span', {
      class: 'sort-chip' + (state.sortBy === key ? ' active' : ''), text: label,
      onclick: () => { state.sortBy = key; render(); }
    }));
  });
  screen.appendChild(sortRow);

  const list = el('div', {id: 'feed-list'});
  list.appendChild(buildFeedList());
  screen.appendChild(list);

  if (state.profile.role === 'organizer') {
    if (state.profile.isCreator || state.profile.verified === true) {
      screen.appendChild(el('button', {class: 'fab', text: '+', onclick: () => { state.screen = 'create'; render(); }}));
    } else {
      screen.appendChild(el('div', {class: 'verify-banner', text: '⏳ Ton compte organisateur est en attente de vérification. Tu pourras publier des soirées une fois validé.', style: 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:calc(100% - 44px); max-width:416px;'}));
    }
  }
  return screen;
}

function renderFeedListOnly() {
  const list = document.getElementById('feed-list');
  if (!list) return;
  list.innerHTML = '';
  list.appendChild(buildFeedList());
}

function buildFeedList() {
  const frag = document.createDocumentFragment();
  let events = state.events.filter(ev => !isEventHidden(ev) && ev.status !== 'cancelled');
  if (state.deptFilter) events = events.filter(ev => ev.dept === state.deptFilter);
  if (state.danceFilter) events = events.filter(ev => (ev.danceStyles||[]).includes(state.danceFilter));
  if (state.searchQuery.trim()) {
    const q = state.searchQuery.trim().toLowerCase();
    events = events.filter(ev => (ev.title||'').toLowerCase().includes(q) || (ev.place||'').toLowerCase().includes(q));
  }
  if (state.showFavoritesOnly) {
    const favs = state.profile.favorites || [];
    events = events.filter(ev => favs.includes(ev.id));
  }
  if (state.sortBy === 'popular') events.sort((a, b) => (b.attendees||[]).length - (a.attendees||[]).length);
  else if (state.sortBy === 'price') events.sort((a, b) => (a.price||0) - (b.price||0));
  else events.sort((a, b) => ((a.dateISO||'') + (a.time||'')).localeCompare((b.dateISO||'') + (b.time||'')));

  if (events.length === 0) {
    frag.appendChild(el('div', {class: 'empty', text: 'Aucune soirée pour le moment.'}));
    return frag;
  }
  events.forEach(ev => {
    const attendees = ev.attendees || [];
    const going = attendees.some(a => a.uid === state.user.uid);
    const isFav = (state.profile.favorites || []).includes(ev.id);
    const card = el('div', { class: 'event-card', onclick: () => { state.currentEventId = ev.id; state.screen = 'detail'; render(); } }, [
      el('button', {
        class: 'fav-btn' + (isFav ? ' active' : ''), text: isFav ? '♥' : '♡',
        onclick: async (e) => {
          e.stopPropagation();
          const favs = state.profile.favorites || [];
          const newFavs = isFav ? favs.filter(id => id !== ev.id) : [...favs, ev.id];
          state.profile.favorites = newFavs;
          render();
          try { await updateDoc(doc(db, 'users', state.user.uid), { favorites: newFavs }); } catch(err) {}
        }
      }),
      el('div', {class: 'event-date', text: formatEventDate(ev.dateISO) + ' · ' + ev.time}),
      el('div', {class: 'event-title', text: ev.title}),
      el('div', {class: 'event-meta', text: ev.place}),
      el('div', {class: 'event-price', text: (ev.price ? ev.price + ' €' : 'Gratuit') + ' · ' + attendees.length + ' inscrit·e·s'})
    ]);
    if ((ev.danceStyles||[]).length) {
      const dwrap = el('div', {style: 'margin-top:6px;'});
      ev.danceStyles.forEach(s => dwrap.appendChild(el('span', {class: 'attendee-chip', text: s, style: 'background:rgba(47,217,255,0.08); border-color:var(--blue-dim); color:var(--blue); cursor:default;'})));
      card.appendChild(dwrap);
    }
    if (ev.dept) card.insertBefore(el('div', {class: 'dept-badge', text: ev.dept}), card.firstChild);
    if (going) card.appendChild(el('div', {class: 'event-going', text: '✓ Tu y vas'}));
    frag.appendChild(card);
  });
  return frag;
}

// ---------- MAP (MapTiler + Leaflet, DA Tron) ----------

const geocodeCache = {};

async function geocodePlace(query) {
  if (!query) return null;
  if (geocodeCache[query]) return geocodeCache[query];
  try {
    const res = await fetch(`https://api.maptiler.com/geocoding/${encodeURIComponent(query)}.json?key=${MAPTILER_KEY}&country=fr&limit=1`);
    const data = await res.json();
    if (!data.features || !data.features.length) { geocodeCache[query] = null; return null; }
    const [lng, lat] = data.features[0].center;
    const result = { lat, lng };
    geocodeCache[query] = result;
    return result;
  } catch (e) {
    return null;
  }
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function eventQueryString(ev) {
  const deptName = ev.dept ? ev.dept.split(' - ')[1] : '';
  return ev.place + (deptName ? ', ' + deptName : '') + ', France';
}

function pinIconHtml(size) {
  const h = Math.round(size * 1.3);
  return `<svg width="${size}" height="${h}" viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 4px #ff2fa8) drop-shadow(0 0 10px #ff2fa8) drop-shadow(0 0 16px #2fd9ff);">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" fill="#ff2fa8"/>
    <circle cx="12" cy="12" r="6" fill="#060608"/>
    <circle cx="12" cy="12" r="2.8" fill="#2fd9ff"/>
  </svg>`;
}

function pinElement(size) {
  const wrap = document.createElement('div');
  wrap.innerHTML = pinIconHtml(size);
  wrap.style.cursor = 'pointer';
  return wrap;
}

function circleGeoJSON(lat, lng, radiusKm, points) {
  points = points || 64;
  const coords = [];
  const distanceX = radiusKm / (111.320 * Math.cos(lat * Math.PI / 180));
  const distanceY = radiusKm / 110.574;
  for (let i = 0; i <= points; i++) {
    const theta = (i / points) * (2 * Math.PI);
    coords.push([lng + distanceX * Math.cos(theta), lat + distanceY * Math.sin(theta)]);
  }
  return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [coords] } };
}

async function initEventMap(container, ev) {
  if (!ev.place) { container.remove(); return; }
  container.innerHTML = '<div class="event-map-loading">Localisation…</div>';
  try {
    let coords;
    if (typeof ev.lat === 'number' && typeof ev.lng === 'number') {
      coords = { lat: ev.lat, lng: ev.lng };
    } else {
      coords = await geocodePlace(eventQueryString(ev));
      if (coords) updateDoc(doc(db, 'events', ev.id), { lat: coords.lat, lng: coords.lng }).catch(() => {});
    }
    if (!coords) throw new Error('no-result');

    container.innerHTML = '';
    const map = new maplibregl.Map({
      container, style: MAP_STYLE_URL, center: [coords.lng, coords.lat], zoom: 14,
      attributionControl: true, scrollZoom: false, dragRotate: false
    });
    map.addControl(new maplibregl.NavigationControl({showCompass: false}), 'top-right');
    new maplibregl.Marker({element: pinElement(30), anchor: 'bottom'}).setLngLat([coords.lng, coords.lat]).addTo(map);

    setTimeout(() => map.resize(), 50);
  } catch (e) {
    container.innerHTML = '<div class="event-map-loading">Carte indisponible</div>';
  }
}

function MapFullScreen() {
  const wrap = el('div', {class: 'map-fullscreen'});

  const controls = el('div', {class: 'map-floating-controls'});
  controls.appendChild(el('div', {class: 'map-floating-topbar'}, [
    el('div', {class: 'brand', text: 'PULSE', style: 'margin-bottom:0;'}),
    el('span', {class: 'map-nav-btn', text: '📋 Liste', onclick: () => { state.viewMode = 'list'; render(); }})
  ]));

  const searchPanel = el('div', {class: 'map-search-panel'});
  searchPanel.appendChild(el('div', {class: 'map-search-title', text: 'Chercher une zone'}));
  if (state.mapSearchError) searchPanel.appendChild(el('div', {class: 'error-msg', style: 'margin-bottom:8px;', text: state.mapSearchError}));

  const cityInput = el('input', {placeholder: 'Ville (ex. Avignon)', value: state.mapSearchCity, style: 'margin-bottom:0;'});
  cityInput.oninput = (e) => { state.mapSearchCity = e.target.value; };
  cityInput.onkeydown = (e) => { if (e.key === 'Enter') runGeoSearch(); };

  const radiusSelect = el('select', {style: 'margin-bottom:0;'});
  [10, 25, 50, 100, 200].forEach(km => {
    const opt = el('option', {text: km + ' km', value: String(km)});
    if (state.mapSearchRadius === km) opt.setAttribute('selected', 'selected');
    radiusSelect.appendChild(opt);
  });
  radiusSelect.onchange = (e) => { state.mapSearchRadius = Number(e.target.value); };

  const searchBtn = el('button', {class: 'geo-search-btn', text: state.mapSearching ? '…' : 'Chercher', onclick: () => runGeoSearch()});

  searchPanel.appendChild(el('div', {class: 'geo-search-row'}, [cityInput, radiusSelect, searchBtn]));
  controls.appendChild(searchPanel);

  if (state.mapSearchLabel) {
    controls.appendChild(el('div', {class: 'map-floating-label'}, [
      document.createTextNode('📍 ' + state.mapSearchLabel + ' — ' + state.mapSearchRadius + ' km'),
      el('span', {text: ' ✕', style: 'color:var(--pink); cursor:pointer; font-weight:700; margin-left:8px;', onclick: () => {
        state.mapSearchCenter = null; state.mapSearchLabel = ''; state.mapSearchCity = ''; render();
      }})
    ]));
  }

  wrap.appendChild(controls);

  const mapCanvas = el('div', {class: 'map-canvas'}, [el('div', {class: 'event-map-loading', text: 'Chargement de la carte…'})]);
  wrap.appendChild(mapCanvas);
  setTimeout(() => renderFranceMap(mapCanvas), 0);

  if (state.profile.role === 'organizer' && (state.profile.isCreator || state.profile.verified === true)) {
    wrap.appendChild(el('button', {class: 'fab', text: '+', onclick: () => { state.screen = 'create'; render(); }}));
  }

  return wrap;

  async function runGeoSearch() {
    const city = state.mapSearchCity.trim();
    if (!city) { state.mapSearchCenter = null; state.mapSearchLabel = ''; state.mapSearchError = ''; render(); return; }
    state.mapSearching = true; state.mapSearchError = ''; render();
    const coords = await geocodePlace(city + ', France');
    state.mapSearching = false;
    if (!coords) { state.mapSearchError = 'Ville introuvable.'; render(); return; }
    state.mapSearchCenter = coords;
    state.mapSearchLabel = city;
    render();
  }
}

async function renderFranceMap(container) {
  let events = state.events.filter(ev => !isEventHidden(ev) && ev.status !== 'cancelled');

  const toGeocode = events.filter(ev => typeof ev.lat !== 'number' || typeof ev.lng !== 'number');
  if (toGeocode.length) {
    await Promise.all(toGeocode.map(async (ev) => {
      const coords = await geocodePlace(eventQueryString(ev));
      if (coords) {
        ev.lat = coords.lat; ev.lng = coords.lng;
        updateDoc(doc(db, 'events', ev.id), { lat: coords.lat, lng: coords.lng }).catch(() => {});
      }
    }));
  }
  events = events.filter(ev => typeof ev.lat === 'number' && typeof ev.lng === 'number');

  if (state.mapSearchCenter) {
    const c = state.mapSearchCenter;
    events = events.filter(ev => haversineKm(c.lat, c.lng, ev.lat, ev.lng) <= state.mapSearchRadius);
  }

  if (!container.isConnected) return;
  container.innerHTML = '';
  const map = new maplibregl.Map({
    container, style: MAP_STYLE_URL, center: [2.3, 46.6], zoom: 6, attributionControl: true
  });
  map.addControl(new maplibregl.NavigationControl({showCompass: false}), 'top-right');

  function markerSizeFor(ev) {
    const n = (ev.attendees || []).length;
    return Math.min(58, 26 + n * 3);
  }

  map.on('load', () => {
    if (state.mapSearchCenter) {
      map.addSource('search-radius', { type: 'geojson', data: circleGeoJSON(state.mapSearchCenter.lat, state.mapSearchCenter.lng, state.mapSearchRadius) });
      map.addLayer({ id: 'search-radius-fill', type: 'fill', source: 'search-radius', paint: { 'fill-color': '#2fd9ff', 'fill-opacity': 0.06 } });
      map.addLayer({ id: 'search-radius-line', type: 'line', source: 'search-radius', paint: { 'line-color': '#2fd9ff', 'line-width': 1 } });
    }

    const markerCoords = [];
    events.forEach(ev => {
      const size = markerSizeFor(ev);
      const popupContent = el('div', {style: 'min-width:170px;'}, [
        el('div', {style: 'font-family:Orbitron,sans-serif;font-size:11px;color:#2fd9ff;margin-bottom:4px;letter-spacing:0.05em;', text: formatEventDate(ev.dateISO) + ' · ' + ev.time}),
        el('div', {style: 'font-weight:700;margin-bottom:4px;', text: ev.title}),
        el('div', {style: 'font-size:12px;color:rgba(245,243,248,0.6);margin-bottom:8px;', text: ev.place + ' · ' + (ev.attendees || []).length + ' inscrit·e·s'}),
        el('span', {style: 'color:#2fd9ff;font-weight:700;cursor:pointer;font-size:13px;', text: 'Voir la soirée →', onclick: () => { state.currentEventId = ev.id; state.screen = 'detail'; render(); }})
      ]);
      const popup = new maplibregl.Popup({offset: Math.round(size * 1.3), closeButton: true}).setDOMContent(popupContent);
      new maplibregl.Marker({element: pinElement(size), anchor: 'bottom'}).setLngLat([ev.lng, ev.lat]).setPopup(popup).addTo(map);
      markerCoords.push([ev.lng, ev.lat]);
    });

    if (markerCoords.length === 0) {
      const emptyEl = document.createElement('div');
      emptyEl.textContent = state.mapSearchCenter ? 'Aucune soirée dans ce rayon.' : 'Aucune soirée à afficher.';
      emptyEl.style.cssText = 'position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:5; background:rgba(6,6,8,0.85); color:rgba(245,243,248,0.75); padding:10px 16px; border-radius:8px; font-size:13px; font-weight:600; border:1px solid var(--line); pointer-events:none;';
      container.appendChild(emptyEl);
    }

    // La caméra "vole" en douceur vers la zone recherchée (ou vers l'ensemble des soirées)
    setTimeout(() => {
      map.resize();
      if (state.mapSearchCenter) {
        map.flyTo({ center: [state.mapSearchCenter.lng, state.mapSearchCenter.lat], zoom: 11, duration: 1500 });
      } else if (markerCoords.length) {
        const lngs = markerCoords.map(c => c[0]), lats = markerCoords.map(c => c[1]);
        map.fitBounds([[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]], { padding: 60, maxZoom: 13, duration: 1500 });
      }
    }, 60);
  });
}

// ---------- DETAIL ----------

function DetailScreen() {
  const ev = state.events.find(e => e.id === state.currentEventId);
  if (!ev) {
    const screen = el('div', {class: 'screen'});
    screen.appendChild(el('button', {class: 'back-btn', text: '← Retour', onclick: () => { state.screen = 'feed'; render(); }}));
    screen.appendChild(el('div', {class: 'empty', text: 'Cette soirée n\'existe plus.'}));
    return screen;
  }
  if (!state.countedViews.has(ev.id)) {
    state.countedViews.add(ev.id);
    updateDoc(doc(db, 'events', ev.id), { views: (ev.views||0) + 1 }).catch(() => {});
  }
  const attendees = ev.attendees || [];
  const going = attendees.some(a => a.uid === state.user.uid);
  const isFav = (state.profile.favorites || []).includes(ev.id);
  const screen = el('div', {class: 'screen'});
  screen.appendChild(el('button', {class: 'back-btn', text: '← Retour', onclick: () => { state.screen = 'feed'; render(); }}));
  if (ev.status === 'cancelled') screen.appendChild(el('div', {class: 'cancelled-badge', text: 'Annulée'}));
  screen.appendChild(el('div', {class: 'event-date', text: formatEventDate(ev.dateISO) + ' · ' + ev.time}));
  screen.appendChild(el('div', {class: 'detail-title', text: ev.title}));
  screen.appendChild(el('div', {class: 'detail-row'}, [el('div', {class: 'detail-label', text: 'Lieu'}), el('div', {text: ev.place})]));
  const organizerNameSpan = el('span', {text: 'Voir le profil →', style: 'color:var(--blue); cursor:pointer; font-weight:600;'});
  organizerNameSpan.onclick = async () => {
    try {
      const snap = await getDoc(doc(db, 'users', ev.organizerUid));
      state.viewedProfile = snap.exists() ? snap.data() : null;
      state.viewedProfileUid = ev.organizerUid;
    } catch(e) { state.viewedProfile = null; }
    state.screen = 'other-profile';
    render();
  };
  screen.appendChild(el('div', {class: 'detail-row'}, [el('div', {class: 'detail-label', text: 'Organisé par'}), organizerNameSpan]));
  screen.appendChild(el('div', {class: 'detail-row'}, [el('div', {class: 'detail-label', text: 'Département'}), el('div', {text: ev.dept || '—'})]));
  screen.appendChild(el('div', {class: 'detail-row'}, [el('div', {class: 'detail-label', text: 'Prix'}), el('div', {text: ev.price ? ev.price + ' €' : 'Gratuit'})]));
  screen.appendChild(el('div', {class: 'detail-row'}, [el('div', {class: 'detail-label', text: 'Participants'}), el('div', {text: attendees.length + ' inscrit·e·s'})]));
  screen.appendChild(el('div', {class: 'detail-desc', text: ev.desc}));

  const mapContainer = el('div', {class: 'event-map'}, [el('div', {class: 'event-map-loading', text: 'Localisation…'})]);
  screen.appendChild(mapContainer);
  setTimeout(() => initEventMap(mapContainer, ev), 0);

  const actionRow = el('div', {style: 'display:flex; gap:10px; margin-bottom:16px;'});
  actionRow.appendChild(el('button', {
    class: 'secondary', text: isFav ? '♥ Favori' : '♡ Ajouter aux favoris', style: 'margin-top:0;',
    onclick: async () => {
      const favs = state.profile.favorites || [];
      const newFavs = isFav ? favs.filter(id => id !== ev.id) : [...favs, ev.id];
      state.profile.favorites = newFavs;
      render();
      try { await updateDoc(doc(db, 'users', state.user.uid), { favorites: newFavs }); } catch(err) {}
    }
  }));
  actionRow.appendChild(el('button', {
    class: 'secondary', text: '↗ Partager', style: 'margin-top:0;',
    onclick: async () => {
      const url = window.location.origin + window.location.pathname + '?event=' + ev.id;
      if (navigator.share) {
        try { await navigator.share({ title: ev.title, text: 'Découvre cette soirée sur Pulse', url }); } catch(e) {}
      } else {
        try { await navigator.clipboard.writeText(url); flashSaved(); } catch(e) {}
      }
    }
  }));
  screen.appendChild(actionRow);

  screen.appendChild(el('button', {
    class: 'secondary', text: '📅 Ajouter à mon calendrier', style: 'margin-top:0; margin-bottom:16px;',
    onclick: () => downloadICS(ev)
  }));

  const attList = el('div', {class: 'attendee-list'});
  attList.appendChild(el('h4', {text: 'Qui vient'}));
  if (attendees.length === 0) {
    attList.appendChild(el('div', {class: 'empty', text: "Personne pour l'instant."}));
  } else {
    attendees.forEach(a => attList.appendChild(el('span', {
      class: 'attendee-chip', text: a.name,
      onclick: async () => {
        try {
          const snap = await getDoc(doc(db, 'users', a.uid));
          state.viewedProfile = snap.exists() ? snap.data() : null;
          state.viewedProfileUid = a.uid;
        } catch(e) { state.viewedProfile = null; }
        state.screen = 'other-profile';
        render();
      }
    })));
  }
  screen.appendChild(attList);

  if (state.user.uid === ev.organizerUid) {
    const manageRow = el('div', {style: 'display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;'});
    manageRow.appendChild(el('button', {class: 'secondary', text: 'Modifier', style: 'margin-top:0; flex:1;', onclick: () => { state.screen = 'edit'; render(); }}));
    manageRow.appendChild(el('button', {class: 'secondary', text: 'Dupliquer', style: 'margin-top:0; flex:1;', onclick: () => { state.screen = 'duplicate'; render(); }}));
    screen.appendChild(manageRow);
    screen.appendChild(el('button', {
      class: 'secondary', text: 'Exporter les participants (CSV)', style: 'margin-top:0; margin-bottom:10px;',
      onclick: () => downloadCSV(ev)
    }));
    if (ev.status !== 'cancelled') {
      screen.appendChild(el('button', {
        class: 'secondary danger-outline', text: 'Annuler la soirée', style: 'margin-top:0; margin-bottom:10px;',
        onclick: async () => {
          const reason = prompt("Message pour les inscrits (raison de l'annulation) :", '');
          if (reason === null) return;
          try {
            await updateDoc(doc(db, 'events', ev.id), { status: 'cancelled', cancelReason: reason || "L'organisateur a annulé cette soirée." });
            state.screen = 'feed'; render();
          } catch(e) { console.error(e); }
        }
      }));
    }
    screen.appendChild(el('button', {
      class: 'secondary danger-outline', text: 'Supprimer définitivement', style: 'margin-top:0;',
      onclick: async () => {
        if (!confirm('Supprimer définitivement cette soirée ?')) return;
        try { await deleteDoc(doc(db, 'events', ev.id)); state.screen = 'feed'; render(); } catch(e) { console.error(e); }
      }
    }));
  }

  if (state.profile.role === 'dancer' && ev.status !== 'cancelled') {
    screen.appendChild(el('button', {
      class: 'primary' + (going ? ' going' : ''),
      text: going ? '✓ Tu y vas — annuler' : "J'y vais",
      onclick: async () => {
        let newAttendees;
        if (going) newAttendees = attendees.filter(a => a.uid !== state.user.uid);
        else newAttendees = [...attendees, { uid: state.user.uid, name: state.profile.name }];
        ev.attendees = newAttendees;
        render();
        try { await updateDoc(doc(db, 'events', ev.id), { attendees: newAttendees }); flashSaved(); } catch (err) { console.error('Échec RSVP', err); }
      }
    }));
  }
  return screen;
}

function downloadCSV(ev) {
  const rows = [['Prénom'], ...(ev.attendees||[]).map(a => [a.name])];
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'participants-' + (ev.title||'soiree').replace(/[^a-z0-9]/gi,'-') + '.csv';
  a.click();
}

function downloadICS(ev) {
  const start = (ev.dateISO||'').replace(/-/g,'') + 'T' + (ev.time||'20:00').replace(':','') + '00';
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT',
    'SUMMARY:' + (ev.title||'Soirée Pulse'),
    'LOCATION:' + (ev.place||''),
    'DESCRIPTION:' + (ev.desc||'').replace(/\n/g,' '),
    'DTSTART:' + start,
    'END:VEVENT','END:VCALENDAR'].join('\n');
  const blob = new Blob([ics], {type: 'text/calendar;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (ev.title||'soiree').replace(/[^a-z0-9]/gi,'-') + '.ics';
  a.click();
}

// ---------- MY EVENTS / HISTORY ----------

function MyEventsScreen() {
  const screen = el('div', {class: 'screen'});
  screen.appendChild(el('button', {class: 'back-btn', text: '← Retour', onclick: () => { state.screen = 'profile'; render(); }}));
  screen.appendChild(el('h1', {text: 'Mes soirées'}));
  const mine = state.events.filter(ev => ev.organizerUid === state.user.uid).sort((a,b) => ((b.dateISO||'')+(b.time||'')).localeCompare((a.dateISO||'')+(a.time||'')));
  if (mine.length === 0) {
    screen.appendChild(el('div', {class: 'empty', text: "Tu n'as pas encore créé de soirée."}));
  } else {
    mine.forEach(ev => {
      const hidden = isEventHidden(ev);
      const card = el('div', { class: 'event-card', onclick: () => { state.currentEventId = ev.id; state.screen = 'detail'; render(); } }, [
        el('div', {class: 'event-date', text: formatEventDate(ev.dateISO) + ' · ' + ev.time}),
        el('div', {class: 'event-title', text: ev.title}),
        el('div', {class: 'event-price', text: (ev.attendees||[]).length + ' inscrit·e·s · ' + (ev.views||0) + ' vues'})
      ]);
      if (ev.status === 'cancelled') card.insertBefore(el('div', {class: 'cancelled-badge', text: 'Annulée'}), card.firstChild);
      else if (hidden) card.insertBefore(el('div', {class: 'dept-badge', text: 'Passée'}), card.firstChild);
      screen.appendChild(card);
    });
  }
  return screen;
}

function HistoryScreen() {
  const screen = el('div', {class: 'screen'});
  screen.appendChild(el('button', {class: 'back-btn', text: '← Retour', onclick: () => { state.screen = 'profile'; render(); }}));
  screen.appendChild(el('h1', {text: 'Historique'}));
  const past = state.events.filter(ev => isEventHidden(ev) && (ev.attendees||[]).some(a => a.uid === state.user.uid))
    .sort((a,b) => ((b.dateISO||'')+(b.time||'')).localeCompare((a.dateISO||'')+(a.time||'')));
  if (past.length === 0) {
    screen.appendChild(el('div', {class: 'empty', text: "Aucune soirée passée pour l'instant."}));
  } else {
    past.forEach(ev => {
      screen.appendChild(el('div', {class: 'event-card'}, [
        el('div', {class: 'event-date', text: formatEventDate(ev.dateISO) + ' · ' + ev.time}),
        el('div', {class: 'event-title', text: ev.title}),
        el('div', {class: 'event-meta', text: ev.place})
      ]));
    });
  }
  return screen;
}

// ---------- CREATE / EDIT / DUPLICATE ----------

function EventFormScreen(existingEvent, mode) {
  const isEdit = mode === 'edit';
  const isDuplicate = mode === 'duplicate';
  const screen = el('div', {class: 'screen'});
  screen.appendChild(el('button', {class: 'back-btn', text: '← Retour', onclick: () => { state.screen = existingEvent ? 'detail' : 'feed'; render(); }}));
  screen.appendChild(el('h1', {text: isEdit ? 'Modifier la soirée' : 'Nouvelle soirée'}));
  if (!isEdit) screen.appendChild(el('p', {class: 'sub', text: 'Renseigne les infos, les danseurs verront ta soirée dans le flux.'}));

  const titleInput = el('input', {placeholder: 'Titre de la soirée', maxlength: '60'});
  const dateInput = el('input', {type: 'date'});
  const timeInput = el('input', {type: 'time'});
  const placeInput = el('input', {placeholder: 'Lieu (ex. La Salsatheque, Marseille)', maxlength: '80'});
  const deptSelect = el('select', {});
  deptSelect.appendChild(el('option', {text: 'Choisir un département', value: ''}));
  DEPARTMENTS.forEach(d => deptSelect.appendChild(el('option', {text: d, value: d})));
  const priceInput = el('input', {placeholder: 'Prix en € (laisser vide si gratuit)', type: 'number', min: '0'});
  const descInput = el('textarea', {placeholder: 'Description', maxlength: '500'});

  let localDanceStyles = existingEvent && existingEvent.danceStyles ? [...existingEvent.danceStyles] : [];

  if (existingEvent) {
    titleInput.value = existingEvent.title || '';
    dateInput.value = isDuplicate ? '' : (existingEvent.dateISO || '');
    timeInput.value = existingEvent.time || '';
    placeInput.value = existingEvent.place || '';
    deptSelect.value = existingEvent.dept || '';
    priceInput.value = existingEvent.price || '';
    descInput.value = existingEvent.desc || '';
  }

  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Titre'}), titleInput]));
  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Date'}), dateInput]));
  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Heure'}), timeInput]));
  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Lieu'}), placeInput]));
  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Département'}), deptSelect]));
  screen.appendChild(el('label', {text: 'Danse(s) au programme'}));
  const danceWrap = el('div', {class: 'style-wrap'});
  DANCE_STYLES.forEach(style => {
    const active = localDanceStyles.includes(style);
    const chip = el('span', {
      class: 'style-chip' + (active ? ' active' : ''), text: style,
      onclick: () => {
        if (localDanceStyles.includes(style)) localDanceStyles = localDanceStyles.filter(s => s !== style);
        else localDanceStyles.push(style);
        chip.className = 'style-chip' + (localDanceStyles.includes(style) ? ' active' : '');
      }
    });
    danceWrap.appendChild(chip);
  });
  screen.appendChild(danceWrap);
  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Prix'}), priceInput]));
  screen.appendChild(el('div', {class: 'field'}, [el('label', {text: 'Description'}), descInput]));

  const submitBtn = el('button', {
    class: 'primary', text: isEdit ? 'Enregistrer les modifications' : 'Publier la soirée',
    onclick: async () => {
      if (!titleInput.value || !dateInput.value || !placeInput.value || !deptSelect.value) return;
      submitBtn.disabled = true;
      submitBtn.textContent = isEdit ? 'Enregistrement…' : 'Publication…';
      const payload = {
        title: titleInput.value, dateISO: dateInput.value, time: timeInput.value || '',
        place: placeInput.value, dept: deptSelect.value, danceStyles: localDanceStyles,
        price: priceInput.value ? Number(priceInput.value) : 0,
        desc: descInput.value || ''
      };
      const coords = await geocodePlace(eventQueryString(payload));
      if (coords) { payload.lat = coords.lat; payload.lng = coords.lng; }
      try {
        if (isEdit) {
          await updateDoc(doc(db, 'events', existingEvent.id), payload);
          state.screen = 'detail';
        } else {
          await addDoc(collection(db, 'events'), { ...payload, attendees: [], views: 0, status: 'active', organizerUid: state.user.uid, createdAt: Date.now() });
          state.screen = 'feed';
        }
        render();
      } catch (err) {
        console.error('Échec enregistrement soirée', err);
        submitBtn.disabled = false;
        submitBtn.textContent = isEdit ? 'Enregistrer les modifications' : 'Publier la soirée';
      }
    }
  });
  screen.appendChild(submitBtn);
  return screen;
}

function CreateScreen() { return EventFormScreen(null, 'create'); }
function EditScreen() {
  const ev = state.events.find(e => e.id === state.currentEventId);
  if (!ev) { state.screen = 'feed'; render(); return el('div'); }
  return EventFormScreen(ev, 'edit');
}
function DuplicateScreen() {
  const ev = state.events.find(e => e.id === state.currentEventId);
  if (!ev) { state.screen = 'feed'; render(); return el('div'); }
  return EventFormScreen(ev, 'duplicate');
}

render();
</script>
