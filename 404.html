<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Pulse</title>
<meta name="theme-color" content="#060608">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #060608; color: #f5f3f8;
    font-family: 'Rajdhani', sans-serif; -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,47,168,0.09) 0%, transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(47,217,255,0.08) 0%, transparent 40%),
      #060608;
  }
  .wrap { text-align: center; max-width: 380px; }
  .brand {
    font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.22em;
    background: linear-gradient(90deg, #f24fac, #4fd4f2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 24px;
  }
  .code {
    font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 64px; line-height: 1;
    color: #4fd4f2; text-shadow: 0 0 24px rgba(47,217,255,0.4);
    margin-bottom: 16px;
  }
  h1 { font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 20px; margin-bottom: 12px; }
  p { color: rgba(245,243,248,0.6); font-size: 16px; line-height: 1.5; margin-bottom: 28px; }
  a.btn {
    display: inline-block; background: #f24fac; color: #0a0510; text-decoration: none;
    padding: 14px 28px; border-radius: 6px; font-weight: 700; font-size: 15px;
    box-shadow: 0 0 16px rgba(255,47,168,0.3);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">PULSE</div>
  <div class="code">404</div>
  <h1>Cette page n'existe pas</h1>
  <p>Le lien que tu as suivi ne mène nulle part, ou la page a été déplacée.</p>
  <a class="btn" href="/PVLSE-APP/">Retour à l'accueil</a>
</div>
</body>
</html>
